name: ADL Insights Database CI & Validation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode: validate, update, or backfill'
        required: true
        default: 'validate'
        type: choice
        options:
          - validate
          - update
          - backfill
  schedule:
    - cron: '15 6 * * 1' # Every Monday at 06:15 UTC
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  test-and-validate:
    name: Test & Validate Database
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit test suite
        run: |
          pytest tests/ -v

      - name: Validate database schema & coverage
        run: |
          python update.py --validate --output-dir data

      - name: Attempt live refresh if requested
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'validate' }}
        shell: bash
        run: |
          echo "Attempting live collection from GitHub Actions environment..."
          MODE="${{ github.event.inputs.mode }}"
          python update.py --${MODE} --output-dir data || {
            echo "WARNING: Live collection from GitHub Actions runner was restricted (e.g. HTTP 403 / Cloud IP block)."
            echo "Per design architecture, automated data collection is executed locally via Windows Task Scheduler."
            echo "Preserving existing master database and passing validation."
            exit 0
          }

      - name: Commit updated archive
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          git diff --cached --quiet || (git commit -m 'Automated refresh of ADL Insights database' && git push)

